async function apiCall(action, payload = {}) {
  if (API_URL.indexOf("GANTI_DENGAN") !== -1) {
    throw new Error("API_URL belum diatur. Silakan isi URL Web App Google Apps Script pada index.html.");
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    // hindari preflight CORS di GAS
    body: JSON.stringify({
      action,
      payload
    })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Terjadi kesalahan pada server.");
  return json.data;
}

// Ambil koordinat GPS pengguna via Geolocation API
function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Geolocation tidak didukung perangkat ini."));
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => resolve({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude
    }), err => reject(new Error("Gagal mengambil lokasi: " + err.message)), {
      enableHighAccuracy: true,
      timeout: 10000
    });
  });
}

// Mengucapkan "Terima Kasih" via suara (Web Speech API) setiap kali absensi ATAU
// pengisian jurnal berhasil disimpan. Dipanggil bersamaan dengan showAcehGreeting().
function ucapkanTerimaKasih() {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel(); // hentikan ucapan sebelumnya supaya tidak menumpuk
    const utter = new SpeechSynthesisUtterance("Trimeung geunaseh");
    utter.lang = "id-ID";
    utter.rate = 1;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    /* abaikan jika Web Speech API tidak didukung perangkat/browser */
  }
}

// Menampilkan notifikasi kecil (toast) berbahasa Aceh "Teurimong Gaseh" setiap kali
// absensi (guru maupun siswa) berhasil dicatat, sekaligus mengucapkan "Terima Kasih".
function showAcehGreeting(text) {
  ucapkanTerimaKasih();
  try {
    let host = document.getElementById("aceh-toast-host");
    if (!host) {
      host = document.createElement("div");
      host.id = "aceh-toast-host";
      host.style.position = "fixed";
      host.style.top = "16px";
      host.style.left = "50%";
      host.style.transform = "translateX(-50%)";
      host.style.zIndex = "9999";
      host.style.display = "flex";
      host.style.flexDirection = "column";
      host.style.gap = "8px";
      host.style.pointerEvents = "none";
      document.body.appendChild(host);
    }
    const toast = document.createElement("div");
    toast.style.background = "linear-gradient(135deg,#0f766e,#0e7490)";
    toast.style.color = "#fff";
    toast.style.padding = "10px 20px";
    toast.style.borderRadius = "999px";
    toast.style.boxShadow = "0 8px 20px rgba(0,0,0,0.18)";
    toast.style.fontWeight = "600";
    toast.style.fontSize = "14px";
    toast.style.letterSpacing = "0.2px";
    toast.style.opacity = "0";
    toast.style.transition = "opacity .25s ease, transform .25s ease";
    toast.style.transform = "translateY(-8px)";
    toast.textContent = "🙏 Teurimong Gaseh — Absensi berhasil disimpan";
    host.appendChild(toast);
    requestAnimationFrame(() => {
      toast.style.opacity = "1";
      toast.style.transform = "translateY(0)";
    });
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateY(-8px)";
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  } catch (e) {
    /* abaikan jika DOM belum siap */
  }
}

  const bulan = new Date().getMonth() + 1; // 1-12
  return bulan >= 7 ? "Ganjil" : "Genap";
}
function tahunAjaranBerjalan() {
  const now = new Date();

async function unduhElemenSebagaiJpg(elementRef, namaFile) {
  if (!elementRef.current || !window.html2canvas) return;
  const canvas = await window.html2canvas(elementRef.current, {
    scale: 4,
    useCORS: true,
    backgroundColor: "#ffffff"
  });
  const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
  const a = document.createElement("a");
  a.href = dataUrl;
  a.download = namaFile + ".jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

    return arr;
  });

    wch: 14

}
